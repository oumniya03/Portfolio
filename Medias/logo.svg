<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Définition du dégradé (Sky vers Indigo) -->
  <defs>
    <linearGradient id="om-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Texte "OM" agrandi, centré, avec fond totalement transparent -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="360" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-10">
    O<tspan fill="url(#om-gradient)">M</tspan>
  </text>
</svg>
