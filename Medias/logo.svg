<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Définition du dégradé (Sky vers Indigo) -->
  <defs>
    <linearGradient id="om-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Le "O" sous forme de cercle parfait -->
  <!-- cx et cy = centre (256,256). r = rayon. stroke-width = épaisseur -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="45" />
  
  <!-- Le "M" à l'intérieur, parfaitement centré -->
  <!-- x="256" et text-anchor="middle" permettent de centrer le texte horizontalement -->
  <text x="256" y="325" font-family="Arial, sans-serif" font-size="200" font-weight="900" fill="url(#om-gradient)" text-anchor="middle">
    M
  </text>
</svg>
