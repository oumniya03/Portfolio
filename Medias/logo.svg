<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Définition du dégradé (Sky vers Indigo) -->
  <defs>
    <linearGradient id="om-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- Fond sombre arrondi -->
  <rect width="512" height="512" rx="128" fill="#ffffff" />
  
  <!-- Bordure lumineuse -->
  
  
  <!-- Texte "OM" -->
  <text x="236" y="335" font-family="Arial, sans-serif" font-size="300" font-weight="1000" fill="#0f172a" text-anchor="middle" letter-spacing="-5">
    O<tspan fill="url(#om-gradient)">M</tspan>
  </text>
  
</svg>
